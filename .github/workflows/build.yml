name: Build AntiPhish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<80"

      - name: Prepare buildozer SDK with tools/bin/sdkmanager shim
        run: |
          BK=$HOME/.buildozer/android/platform/android-sdk
          rm -rf $BK
          mkdir -p $BK
          cp -a $ANDROID_HOME/cmdline-tools $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/build-tools $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/platform-tools $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/platforms $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/licenses $BK/ 2>/dev/null || true
          SDKMAN=$(find $BK/cmdline-tools -name sdkmanager -type f | head -1)
          mkdir -p $BK/tools/bin
          if [ -n "$SDKMAN" ]; then
            ln -sf $SDKMAN $BK/tools/bin/sdkmanager
          fi
          echo "sdkmanager: $SDKMAN"
          $BK/tools/bin/sdkmanager --version || true

      - name: FORCE clean any cached p4a
        run: |
          rm -rf $HOME/.buildozer/android/platform/python-for-android
          rm -rf .buildozer
          rm -rf $HOME/.buildozer/android/platform/build-arm64-v8a

      - name: Pre-clone and patch p4a
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          cd $HOME/.buildozer/android/platform
          git clone --depth 1 -b master https://github.com/kivy/python-for-android.git
          cd python-for-android

          KIVY_RECIPE=pythonforandroid/recipes/kivy/__init__.py
          sed -i "s/^    version = '2.3.1'/    version = None/" $KIVY_RECIPE || true
          sed -i 's/^    version = "2.3.1"/    version = None/' $KIVY_RECIPE || true

          PKG=pythonforandroid/pythonpackage.py
          python3 -c "
import re
path = '$PKG'
src = open(path).read()
src = re.sub(r'def get_dep_names\(arch, exclude=None\):.*?(?=\ndef |\Z)',
             'def get_dep_names(arch, exclude=None):\n    return []\n\n',
             src, count=1, flags=re.S)
open(path, 'w').write(src)
print('patched pythonpackage.get_dep_names')
"

          find . -name "*.pyc" -delete
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

          echo "=== kivy recipe ==="
          grep -n "version" pythonforandroid/recipes/kivy/__init__.py | head -3
          echo "=== pythonpackage ==="
          grep -A 2 "def get_dep_names" pythonforandroid/pythonpackage.py | head -3

      - name: Build with buildozer
        run: buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antiphish-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
