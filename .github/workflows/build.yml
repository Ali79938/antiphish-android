name: Build AntiPhish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<80"

      - name: Prime buildozer Android SDK with licenses accepted
        run: |
          # Create buildozer's expected SDK directory
          BK_SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $BK_SDK
          
          # Copy GitHub's pre-installed command-line tools and build-tools
          cp -r $ANDROID_HOME/cmdline-tools $BK_SDK/ 2>/dev/null || true
          cp -r $ANDROID_HOME/build-tools $BK_SDK/ 2>/dev/null || true
          cp -r $ANDROID_HOME/platform-tools $BK_SDK/ 2>/dev/null || true
          cp -r $ANDROID_HOME/platforms $BK_SDK/ 2>/dev/null || true
          cp -r $ANDROID_HOME/licenses $BK_SDK/ 2>/dev/null || true
          
          # Ensure tools/bin/sdkmanager exists (buildozer 1.5.0 expects this path)
          mkdir -p $BK_SDK/tools/bin
          cp $BK_SDK/cmdline-tools/latest/bin/* $BK_SDK/tools/bin/ 2>/dev/null || true
          
          # Print what we have
          echo "=== buildozer SDK contents ==="
          ls -la $BK_SDK/
          echo "=== build-tools versions ==="
          ls -la $BK_SDK/build-tools/ || echo "no build-tools"
          echo "=== aidl locations ==="
          find $BK_SDK -name aidl -type f 2>/dev/null || echo "no aidl found"
          echo "=== licenses ==="
          ls -la $BK_SDK/licenses/ || echo "no licenses"

      - name: Build with buildozer
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antiphish-apk
          path: bin/*.apk
          retention-days: 30
