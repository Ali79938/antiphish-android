name: Build AntiPhish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<80"

      - name: Set up Android SDK from runner
        run: |
          BK=$HOME/.buildozer/android/platform/android-sdk
          rm -rf $BK
          mkdir -p $BK
          cp -a $ANDROID_HOME/cmdline-tools $BK/
          cp -a $ANDROID_HOME/build-tools $BK/
          cp -a $ANDROID_HOME/platform-tools $BK/
          cp -a $ANDROID_HOME/platforms $BK/
          cp -a $ANDROID_HOME/licenses $BK/
          SDKMAN=$(find $BK/cmdline-tools -name sdkmanager -type f | head -1)
          mkdir -p $BK/tools/bin
          ln -sf $SDKMAN $BK/tools/bin/sdkmanager
          echo "sdkmanager: $SDKMAN"
          echo "aidl: $(find $BK/build-tools -name aidl -type f | head -1)"

      - name: Clear any cached p4a and build trees
        run: |
          rm -rf $HOME/.buildozer/android/platform/python-for-android
          rm -rf .buildozer
          rm -rf $HOME/.buildozer/android/platform/build-arm64-v8a

      - name: Clone p4a and apply patches
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          cd $HOME/.buildozer/android/platform
          git clone --depth 1 -b master https://github.com/kivy/python-for-android.git
          cd python-for-android

          # Patch kivy recipe version to None
          KIVY=pythonforandroid/recipes/kivy/__init__.py
          sed -i "s/^    version = '2.3.1'/    version = None/" $KIVY || true
          sed -i 's/^    version = "2.3.1"/    version = None/' $KIVY || true

          # Stub out pythonpackage.py completely
          cat > pythonforandroid/pythonpackage.py << 'PYEOF'
          """Stubbed - p4a no longer resolves any pip packages.
          All packages are provided by recipes.
          """

          def get_dep_names(arch, exclude=None):
              return []

          def get_python_dep_names(arch):
              return []

          def get_recipe_dep_names(arch):
              return []
          PYEOF

          # Wipe pyc caches
          find . -name "*.pyc" -delete 2>/dev/null || true
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

          echo "=== kivy recipe ==="
          grep -n "version" pythonforandroid/recipes/kivy/__init__.py | head -3
          echo "=== pythonpackage ==="
          head -5 pythonforandroid/pythonpackage.py

      - name: Build with buildozer
        run: buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antiphish-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
