name: Build AntiPhish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<80"

      - name: Prepare buildozer SDK with tools/bin/sdkmanager shim
        run: |
          BK=$HOME/.buildozer/android/platform/android-sdk
          rm -rf $BK
          mkdir -p $BK

          cp -a $ANDROID_HOME/cmdline-tools $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/build-tools $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/platform-tools $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/platforms $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/licenses $BK/ 2>/dev/null || true

          SDKMAN=$(find $BK/cmdline-tools -name sdkmanager -type f | head -1)
          mkdir -p $BK/tools/bin
          if [ -n "$SDKMAN" ]; then
            ln -sf $SDKMAN $BK/tools/bin/sdkmanager
          fi

          AIDL=$(find $BK/build-tools -name aidl -type f | head -1)
          echo "Found sdkmanager at: $SDKMAN"
          echo "Found aidl at: $AIDL"

          ls -la $BK/tools/bin/
          $BK/tools/bin/sdkmanager --version || echo "sdkmanager failed"

      - name: Pre-clone and patch p4a
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          cd $HOME/.buildozer/android/platform

          # Clone p4a
          if [ ! -d python-for-android ]; then
            git clone --depth 1 -b master https://github.com/kivy/python-for-android.git
          fi

          cd python-for-android

          # Patch kivy recipe: keep version but mark as recipe-only
          KIVY_RECIPE=pythonforandroid/recipes/kivy/__init__.py
          if [ -f "$KIVY_RECIPE" ]; then
            sed -i "s/version = '2.3.1'/version = None/" $KIVY_RECIPE || true
            sed -i 's/version = "2.3.1"/version = None/' $KIVY_RECIPE || true
            # Store the real version separately for the recipe itself
            grep -q "_kivy_real_version" $KIVY_RECIPE || echo "_kivy_real_version = '2.3.1'" >> $KIVY_RECIPE
          fi

          # Patch pythonpackage.py to skip recipes during pip resolution
          PKG=pythonforandroid/pythonpackage.py
          if [ -f "$PKG" ]; then
            python3 -c "
          import re
          src = open('$PKG').read()
          # In get_dep_names, skip anything that is a recipe name
          src = src.replace('def get_dep_names(arch, exclude=None):',
                            'def get_dep_names(arch, exclude=None):\n    return []')
          open('$PKG', 'w').write(src)
          print('patched pythonpackage.get_dep_names')
          " || true
          fi

          echo "=== kivy recipe version ==="
          grep -n "version" pythonforandroid/recipes/kivy/__init__.py | head -5

      - name: Build with buildozer
        run: buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antiphish-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
