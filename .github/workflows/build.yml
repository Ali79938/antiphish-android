name: Build AntiPhish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<80"

      - name: Prepare buildozer SDK with tools/bin/sdkmanager shim
        run: |
          BK=$HOME/.buildozer/android/platform/android-sdk
          rm -rf $BK
          mkdir -p $BK

          # Copy from GitHub's real SDK
          cp -a $ANDROID_HOME/cmdline-tools $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/build-tools $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/platform-tools $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/platforms $BK/ 2>/dev/null || true
          cp -a $ANDROID_HOME/licenses $BK/ 2>/dev/null || true

          # Find the sdkmanager binary (path differs by SDK version)
          SDKMAN=$(find $BK/cmdline-tools -name sdkmanager -type f | head -1)
          echo "Found sdkmanager at: $SDKMAN"

          # Create the old-style tools/bin path that buildozer 1.5.0 wants
          mkdir -p $BK/tools/bin
          if [ -n "$SDKMAN" ]; then
            ln -sf $SDKMAN $BK/tools/bin/sdkmanager
          fi

          # Also create tools/bin/aidl if it's missing (buildozer checks for it)
          AIDL=$(find $BK/build-tools -name aidl -type f | head -1)
          echo "Found aidl at: $AIDL"

          echo "=== verify ==="
          ls -la $BK/tools/bin/
          $BK/tools/bin/sdkmanager --version || echo "sdkmanager failed"

      - name: Build with buildozer
        run: buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antiphish-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
