name: Build AntiPhish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev build-essential ccache
          sudo apt install -y aidl || true
          sudo apt install -y android-sdk-build-tools || true
          echo "=== aidl location check ==="
          which aidl || true
          ls -la /usr/bin/aidl || true
          find / -name aidl -type f 2>/dev/null | head -5

      - name: Manual aidl fallback
        run: |
          if ! which aidl; then
            echo "aidl missing - downloading from Google"
            mkdir -p $HOME/android-sdk
            cd $HOME/android-sdk
            curl -sL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            yes | latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "build-tools;34.0.0" > /dev/null 2>&1 || true
            echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          fi
          which aidl || ls -la $HOME/android-sdk/build-tools/34.0.0/ || true

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<80"

      - name: Patch p4a Python version to 3.12.10
        run: |
          P4A=~/.buildozer/android/platform/python-for-android
          if [ -d "$P4A" ]; then
            cd $P4A/pythonforandroid/recipes
            sed -i "s/version = '3.14.2'/version = '3.12.10'/" python3/__init__.py || true
            sed -i 's/version = "3.14.2"/version = "3.12.10"/' hostpython3/__init__.py || true
          fi

      - name: Build with buildozer
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antiphish-apk
          path: bin/*.apk
          retention-days: 30
